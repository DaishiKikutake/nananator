# Cloudflare Workers の設定
# name はCloudflareの画面で作ったWorkerの名前と同じにしてください
name = "nananator"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

# 挑戦者数のカウンター
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "VisitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]
